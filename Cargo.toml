[package]
name = "kofte-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.88"
axum = { version = "0.8.3", features = ["multipart"] }
axum-extra = { version = "0.10.1", features = ["query", "typed-header"] }
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.31"
futures-util = "0.3.31"
headless_chrome = "1.0.17"
http-body-util = "0.1.3"
image = "0.25.6"
mime_guess = "2.0.5"
minijinja = { version = "2.9.0", default-features = false, features = ["builtins", "macros", "serde", "speedups", "urlencode"] }
minijinja-contrib = {version="2.9.0",  features = ["datetime", "timezone", "time-tz", "time"] }
mongodb = "3.2.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
time = { version = "0.3.41", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.44.2", features = ["full"] }
tokio-util = "0.7.14"
tower-http = { version = "0.6.2", features = ["cors", "limit", "trace","redirect"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter",  "time",
  "local-time",] }
utoipa = { version = "5.3.1", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.1", features = ["axum"] }
uuid = { version = "1.16.0", features = ["v4"] }

[profile.release]
lto = "thin" 
debug = 0 
strip = "debuginfo" 
opt-level = "s" 
